apiVersion: v1
kind: Service
metadata:
  name: keycloak-external
  namespace: default
spec:
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Endpoints
metadata:
  name: keycloak-external
  namespace: default
subsets:
  - addresses:
      - ip: 172.31.0.62
    ports:
      - port: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  ingressClassName: nginx
  rules:
    - host: sso.amazingaws.com
      http:
        paths:
          - path: /keycloak
            pathType: Prefix
            backend:
              service:
                name: keycloak-external
                port:
                  number: 8081
